# 1. Eliminate Esc key delay (prevents sluggish text input)
set -s escape-time 10

# 2. Fix Shift+Enter for multi-line inputs in Claude Code
set -g extended-keys always

# 3. Enable clipboard synchronization (for the /copy command)
set -g allow-passthrough on
set -s set-clipboard on

# 4. Enable mouse mode for mouse scrolling (crucial for fullscreen mode)
set -g mouse on
